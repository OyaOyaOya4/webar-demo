<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>カスタムマーカーWebAR</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* AR.jsのキャンバスを全画面表示に強制 */
        .a-canvas, .a-canvas.fullscreen {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
        }
        
        /* AR.jsのコンテナも全画面に */
        #arjsDebugUIContainer, .arjs-loader {
            height: 100% !important;
            width: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        
        .arjs-loader {
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
            font-family: sans-serif;
        }
        
        #status-message {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 999;
            background-color: rgba(255, 165, 0, 0.7);
            color: black;
        }
    </style>
</head>
<body>
    <!-- ローディング表示 -->
    <div class="arjs-loader">
        <div>カメラへのアクセスを許可してください<br>読み込み中...</div>
    </div>
    
    <!-- マーカー認識状態の表示 -->
    <div id="status-message">マーカーを探しています...</div>
    
    <!-- A-Frame シーン -->
    <a-scene
        embedded
        arjs="sourceType: webcam; 
              debugUIEnabled: false; 
              sourceWidth: 1080; 
              sourceHeight: 1920; 
              displayWidth: 1080; 
              displayHeight: 1920;
              trackingMethod: best;
              facingMode: environment;"
        renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
        vr-mode-ui="enabled: false">
        
        <!-- カスタムマーカーの設定 -->
        <a-marker 
            type="pattern" 
            url="marker/pattern-marker.patt" 
            id="custom-marker"
            emitevents="true"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
            raycaster="objects: .clickable"
            cursor="fuse: false; rayOrigin: mouse;">
            
            <!-- 3Dモデルの配置 - 直接表示するプリミティブを追加 -->
            <a-box position="0 0.5 0" color="red" class="clickable" scale="1 1 1"></a-box>
            
            <!-- 3Dモデルの配置 - GLTFモデル -->
            <a-entity
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.05 0.05 0.05"
                gltf-model="models/model.glb"
                class="clickable">
            </a-entity>
        </a-marker>
        
        <!-- カメラ - 背面カメラを指定 -->
        <a-entity camera="active: true; facingMode: environment;" look-controls></a-entity>
    </a-scene>
    
    <script>
        // 要素の取得
        const scene = document.querySelector('a-scene');
        const marker = document.querySelector('#custom-marker');
        const statusMessage = document.getElementById('status-message');
        const model = document.querySelector('[gltf-model]');
        
        // モデルのロード状態を確認
        if (model) {
            model.addEventListener('model-loaded', function() {
                console.log('3Dモデルが正常に読み込まれました');
            });
            
            model.addEventListener('model-error', function(e) {
                console.error('3Dモデル読み込みエラー:', e);
                // エラー時に赤いボックスを表示（モデルの代わり）
                const errorBox = document.createElement('a-box');
                errorBox.setAttribute('color', 'red');
                errorBox.setAttribute('position', '0 0.5 0');
                errorBox.setAttribute('scale', '0.5 0.5 0.5');
                marker.appendChild(errorBox);
            });
        }
        
        // カメラ表示を全画面にするための追加処理
        window.addEventListener('load', function() {
            setTimeout(() => {
                const canvas = document.querySelector('.a-canvas');
                if (canvas) {
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                    canvas.style.objectFit = 'cover';
                }
                
                // 背面カメラを強制的に使用
                navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: "environment" }
                    }
                }).then(function(stream) {
                    console.log('背面カメラ起動成功');
                }).catch(function(err) {
                    console.error('背面カメラ起動エラー:', err);
                    // 通常のカメラアクセスを試みる
                    navigator.mediaDevices.getUserMedia({
                        video: true
                    }).then(function(stream) {
                        console.log('カメラ起動成功（フォールバック）');
                    }).catch(function(err) {
                        console.error('カメラ起動完全失敗:', err);
                        alert('カメラへのアクセスに失敗しました。ブラウザの設定を確認してください。');
                    });
                });
            }, 1000);
        });
        
        // シーンのロード完了時
        scene.addEventListener('loaded', function () {
            document.querySelector('.arjs-loader').style.display = 'none';
            console.log('ARシステム準備完了');
        });
        
        // マーカーが検出されたとき
        marker.addEventListener('markerFound', function() {
            console.log('マーカーを検出しました！');
            statusMessage.textContent = 'マーカーを検出しました！';
            statusMessage.style.backgroundColor = 'rgba(0, 128, 0, 0.7)';
            statusMessage.style.color = 'white';
            
            // 振動フィードバック
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
        });
        
        // マーカーが見失われたとき
        marker.addEventListener('markerLost', function() {
            console.log('マーカーを見失いました');
            statusMessage.textContent = 'マーカーを探しています...';
            statusMessage.style.backgroundColor = 'rgba(255, 165, 0, 0.7)';
            statusMessage.style.color = 'black';
        });
        
        // モデル読み込みエラーの監視
        document.addEventListener('model-error', function(e) {
            console.error('モデル読み込みエラー:', e.detail);
            statusMessage.textContent = 'モデル読み込みエラー';
            statusMessage.style.backgroundColor = 'rgba(255, 0, 0, 0.7)';
            statusMessage.style.color = 'white';
        });
        
        // iOS Safariでの全画面表示対応
        function iosFullscreenFix() {
            if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                window.scrollTo(0, 0);
                document.body.style.height = `${window.innerHeight}px`;
            }
        }
        
        window.addEventListener('resize', iosFullscreenFix);
        iosFullscreenFix();
        
        // デバッグ情報
        console.log('AR.js設定:', document.querySelector('a-scene').getAttribute('arjs'));
        console.log('カメラ設定:', document.querySelector('a-entity[camera]').getAttribute('camera'));
    </script>
</body>
</html>
