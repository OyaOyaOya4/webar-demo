<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - マーカー認識型AR</title>
    
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
            font-family: sans-serif;
        }
        
        #status-message {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 999;
            background-color: rgba(255, 165, 0, 0.7);
            color: black;
        }
        
        #camera-switch {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }
        
        #github-link {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.5);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <!-- ローディング表示 -->
    <div class="arjs-loader">
        <div>カメラへのアクセスを許可してください<br>読み込み中...</div>
    </div>
    
    <!-- マーカー認識状態の表示 -->
    <div id="status-message">マーカーを探しています...</div>
    
    <!-- カメラ切り替えボタン -->
    <button id="camera-switch">カメラ切替</button>
    
    <!-- GitHubリンク -->
    <a id="github-link" href="https://github.com/あなたのユーザー名/あなたのリポジトリ名" target="_blank">GitHub</a>
    
    <!-- A-Frame シーン -->
    <a-scene
        embedded
        arjs="sourceType: webcam; 
              debugUIEnabled: false; 
              detectionMode: mono_and_matrix; 
              matrixCodeType: 3x3;
              trackingMethod: best;
              facingMode: environment;"
        renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
        vr-mode-ui="enabled: false">
        
        <!-- カスタムマーカーの設定 -->
        <a-marker 
            type="pattern" 
            url="marker/pattern-marker.patt" 
            id="custom-marker"
            emitevents="true"
            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            smoothThreshold="2"
            raycaster="objects: .clickable"
            cursor="fuse: false; rayOrigin: mouse;">
            
            <!-- 3Dモデルの配置 -->
            <a-entity
                id="model-entity"
                position="0 0 -2"
                rotation="0 0 0"
                scale="0.05 0.05 0.05"
                gltf-model="models/model.glb"
                class="clickable"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;">
            </a-entity>
        </a-marker>
        
        <!-- カメラ -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
        // 要素の取得
        const scene = document.querySelector('a-scene');
        const marker = document.querySelector('#custom-marker');
        const statusMessage = document.getElementById('status-message');
        const modelEntity = document.getElementById('model-entity');
        const cameraSwitch = document.getElementById('camera-switch');
        
        // 利用可能なカメラデバイスを保存する変数
        let videoDevices = [];
        let currentCameraIndex = 0;
        
        // カメラ切り替えボタンのイベント
        cameraSwitch.addEventListener('click', function() {
            switchCamera();
        });
        
        // カメラを切り替える関数
        function switchCamera() {
            if (videoDevices.length <= 1) {
                alert('切り替え可能なカメラがありません');
                return;
            }
            
            // 次のカメラインデックスを計算
            currentCameraIndex = (currentCameraIndex + 1) % videoDevices.length;
            
            // 現在のビデオストリームを停止
            const video = document.querySelector('video');
            if (video && video.srcObject) {
                const tracks = video.srcObject.getTracks();
                tracks.forEach(track => track.stop());
            }
            
            // 新しいカメラでストリームを開始
            navigator.mediaDevices.getUserMedia({
                video: {
                    deviceId: {exact: videoDevices[currentCameraIndex].deviceId}
                }
            }).then(function(stream) {
                console.log(`カメラ切替: ${currentCameraIndex} (${videoDevices[currentCameraIndex].label})`);
                if (video) {
                    video.srcObject = stream;
                    video.play();
                }
            }).catch(function(err) {
                console.error('カメラ切替エラー:', err);
            });
        }
        
        // 利用可能なカメラを列挙
        function enumerateDevices() {
            navigator.mediaDevices.enumerateDevices()
                .then(function(devices) {
                    videoDevices = devices.filter(device => device.kind === 'videoinput');
                    console.log('利用可能なカメラ:', videoDevices);
                    
                    // 背面カメラのインデックスを推測（通常は最後のデバイス）
                    if (videoDevices.length > 1) {
                        currentCameraIndex = videoDevices.length - 1;
                    }
                })
                .catch(function(err) {
                    console.error('デバイス列挙エラー:', err);
                });
        }
        
        // シーンのロード完了時
        scene.addEventListener('loaded', function () {
            document.querySelector('.arjs-loader').style.display = 'none';
            console.log('ARシステム準備完了');
            
            // デバイス列挙を実行
            enumerateDevices();
            
            // 背面カメラを優先的に使用
            preferBackCamera();
        });
        
        // 背面カメラを優先的に使用する関数
        function preferBackCamera() {
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: "environment" }
                }
            }).then(function(stream) {
                console.log('背面カメラ起動成功');
                const video = document.querySelector('video');
                if (video) {
                    video.srcObject = stream;
                }
            }).catch(function(err) {
                console.error('背面カメラ起動エラー:', err);
            });
        }
        
        // モデルのロード状態を確認
        modelEntity.addEventListener('model-loaded', function() {
            console.log('3Dモデルが正常に読み込まれました');
        });
        
        modelEntity.addEventListener('model-error', function(e) {
            console.error('3Dモデル読み込みエラー:', e);
            // エラー時にフォールバック表示
            const errorBox = document.createElement('a-box');
            errorBox.setAttribute('color', 'red');
            errorBox.setAttribute('position', '0 0.5 0');
            errorBox.setAttribute('scale', '0.5 0.5 0.5');
            marker.appendChild(errorBox);
        });
        
        // マーカーが検出されたとき
        marker.addEventListener('markerFound', function() {
            console.log('マーカーを検出しました！');
            statusMessage.textContent = 'マーカーを検出しました！';
            statusMessage.style.backgroundColor = 'rgba(0, 128, 0, 0.7)';
            statusMessage.style.color = 'white';
            
            // 振動フィードバック
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
            
            // モデルを表示
            modelEntity.setAttribute('visible', true);
        });
        
        // マーカーが見失われたとき
        marker.addEventListener('markerLost', function() {
            console.log('マーカーを見失いました');
            statusMessage.textContent = 'マーカーを探しています...';
            statusMessage.style.backgroundColor = 'rgba(255, 165, 0, 0.7)';
            statusMessage.style.color = 'black';
        });
        
        // モバイルデバイスの向きが変わったときに調整
        window.addEventListener('orientationchange', function() {
            setTimeout(function() {
                const canvas = document.querySelector('.a-canvas');
                if (canvas) {
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                }
            }, 200);
        });
        
        // タッチイベントでモデルとインタラクション
        modelEntity.addEventListener('click', function() {
            // モデルがクリックされたときの処理
            console.log('モデルがクリックされました');
            
            // 例: モデルを回転させる
            const currentRotation = modelEntity.getAttribute('rotation');
            modelEntity.setAttribute('animation', {
                property: 'rotation',
                to: `${currentRotation.x} ${currentRotation.y + 360} ${currentRotation.z}`,
                dur: 1000,
                easing: 'easeOutQuad'
            });
            
            // 振動フィードバック
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        });
    </script>
</body>
</html>
