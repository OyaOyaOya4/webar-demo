<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR アプリケーション</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #arView {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        .message {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="permission-message" class="message">カメラへのアクセスを許可してください</div>
    <div id="loading-message" class="message" style="display:none;">読み込み中...</div>
    <div id="scanning-message" class="message" style="display:none;">マーカーを探しています...</div>
    
    <div id="arView"></div>
    
    <!-- AR.jsやThree.jsなどのライブラリを読み込む -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        window.onload = function() {
            // カメラへのアクセス許可後の処理
            document.getElementById('permission-message').style.display = 'none';
            document.getElementById('loading-message').style.display = 'block';
            
            // ARの初期化が完了したら
            setTimeout(function() {
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('scanning-message').style.display = 'block';
            }, 2000);
        };
    </script>
</body>
</html>
