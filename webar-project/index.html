<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>カスタムマーカーWebAR</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* AR.jsのキャンバスを全画面表示に強制 */
        .a-canvas, .a-canvas.fullscreen {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
        }
        
        /* AR.jsのコンテナも全画面に */
        #arjsDebugUIContainer, .arjs-loader {
            height: 100% !important;
            width: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        
        .arjs-loader {
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
            font-family: sans-serif;
        }
        
        #status-message {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 999;
            background-color: rgba(255, 165, 0, 0.7);
            color: black;
        }
    </style>
</head>
<body>
    <!-- ローディング表示 -->
    <div class="arjs-loader">
        <div>カメラへのアクセスを許可してください<br>読み込み中...</div>
    </div>
    
    <!-- マーカー認識状態の表示 -->
    <div id="status-message">マーカーを探しています...</div>
    
    <!-- A-Frame シーン -->
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1080; sourceHeight: 1920; displayWidth: 1080; displayHeight: 1920;"
        renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
        vr-mode-ui="enabled: false">
        
        <!-- カスタムマーカーの設定 -->
        <a-marker 
            type="pattern" 
            url="marker/pattern-marker.patt" 
            id="custom-marker"
            emitevents="true"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">
            <!-- 3Dモデルの配置 -->
            <a-entity
                position="0 0 0"
                rotation="0 0 0"
                scale="0.05 0.05 0.05"
                gltf-model="models/model.glb">
            </a-entity>
        </a-marker>
        
        <!-- カメラ -->
        <a-entity camera="active: true" look-controls></a-entity>
    </a-scene>
    
    <script>
        // 要素の取得
        const scene = document.querySelector('a-scene');
        const marker = document.querySelector('#custom-marker');
        const statusMessage = document.getElementById('status-message');
        
        // カメラ表示を全画面にするための追加処理
        window.addEventListener('load', function() {
            setTimeout(() => {
                const canvas = document.querySelector('.a-canvas');
                if (canvas) {
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                    canvas.style.objectFit = 'cover';
                }
            }, 1000);
        });
        
        // シーンのロード完了時
        scene.addEventListener('loaded', function () {
            document.querySelector('.arjs-loader').style.display = 'none';
            console.log('ARシステム準備完了');
        });
        
        // マーカーが検出されたとき
        marker.addEventListener('markerFound', function() {
            console.log('マーカーを検出しました！');
            statusMessage.textContent = 'マーカーを検出しました！';
            statusMessage.style.backgroundColor = 'rgba(0, 128, 0, 0.7)';
            statusMessage.style.color = 'white';
            
            // 振動フィードバック
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
        });
        
        // マーカーが見失われたとき
        marker.addEventListener('markerLost', function() {
            console.log('マーカーを見失いました');
            statusMessage.textContent = 'マーカーを探しています...';
            statusMessage.style.backgroundColor = 'rgba(255, 165, 0, 0.7)';
            statusMessage.style.color = 'black';
        });
        
        // モデル読み込みエラーの監視
        document.addEventListener('model-error', function(e) {
            console.error('モデル読み込みエラー:', e.detail.src);
            statusMessage.textContent = 'モデル読み込みエラー';
            statusMessage.style.backgroundColor = 'rgba(255, 0, 0, 0.7)';
            statusMessage.style.color = 'white';
        });
        
        // iOS Safariでの全画面表示対応
        function iosFullscreenFix() {
            if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                window.scrollTo(0, 0);
                document.body.style.height = `${window.innerHeight}px`;
            }
        }
        
        window.addEventListener('resize', iosFullscreenFix);
        iosFullscreenFix();
    </script>
</body>
</html>
