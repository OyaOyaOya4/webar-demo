<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR マーカー認識</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        .arjs-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            color: white;
        }
        .message {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="arjs-loader">
        <div>カメラへのアクセスを許可してください</div>
    </div>
    <div id="scanning-message" class="message" style="display:none;">マーカーを探しています...</div>
    
    <a-scene embedded vr-mode-ui="enabled: false" ar-settings arjs="trackingMethod: best; debugUIEnabled: false;">
        <a-assets>
            <!-- 必要なアセットをここに読み込む -->
        </a-assets>
        
        <!-- カメラ設定の最適化 -->
        <a-marker id="animated-marker" type="pattern" url="path/to/your/pattern-marker.patt" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
            <!-- マーカー上に表示するコンテンツ -->
            <a-box position="0 0.5 0" material="color: red;"></a-box>
        </a-marker>
        
        <!-- バックアップとしてバーコードマーカーも追加 -->
        <a-marker type="barcode" value="5">
            <a-box position="0 0.5 0" material="color: blue;"></a-box>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
        window.addEventListener('camera-init', function() {
            document.querySelector('.arjs-loader').style.display = 'none';
            document.getElementById('scanning-message').style.display = 'block';
        });
        
        // マーカーが見つかった時のイベント
        document.getElementById('animated-marker').addEventListener('markerFound', function() {
            document.getElementById('scanning-message').textContent = 'マーカーを認識しました！';
            document.getElementById('scanning-message').style.backgroundColor = 'rgba(0, 255, 0, 0.5)';
        });
        
        // マーカーを見失った時のイベント
        document.getElementById('animated-marker').addEventListener('markerLost', function() {
            document.getElementById('scanning-message').textContent = 'マーカーを探しています...';
            document.getElementById('scanning-message').style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
        });
    </script>
</body>
</html>
